# ─────────────────────────────────────────────
# Netlify build configuration: Deyora Intelligence
# ─────────────────────────────────────────────

[build]
  command = "npm run build"   # runs the claims check first (prebuild)
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  NEXT_TELEMETRY_DISABLED = "1"

# Official Next.js runtime: SSR, ISR, image optimisation and the App Router.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hashed build assets never change, so they can be cached for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand images keep their names when replaced, so they get a short cache.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    # The site loads nothing from other origins: fonts are self-hosted by
    # next/font, and the contact form posts to this site. Next.js needs inline
    # scripts and styles for hydration.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
