<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C5D7FF"/>
      <stop offset="70%" stop-color="#5C8AFF"/>
      <stop offset="100%" stop-color="#1F4FCC"/>
    </linearGradient>
    <linearGradient id="dgrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#9BBBFF"/>
      <stop offset="100%" stop-color="#2B6BFF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#000000"/>
  <g transform="translate(200 200) rotate(45)">
    <!--
      Two curved D-shaped brackets, facing each other.
      Upper bracket: flat top edge, curved bottom edge that opens downward.
      Lower bracket: mirror — flat bottom edge, curved top edge opening upward.
      After the 45° rotation, they read as two interlocking ")(" brackets.
    -->
    <!-- Upper bracket -->
    <path
      d="M -110 -120
         L 110 -120
         L 110 -55
         Q 110 -5, 55 -5
         L -55 -5
         Q -110 -5, -110 -55
         Z"
      fill="url(#dgrad)"/>
    <!-- Lower bracket — mirror -->
    <path
      d="M 110 120
         L -110 120
         L -110 55
         Q -110 5, -55 5
         L 55 5
         Q 110 5, 110 55
         Z"
      fill="url(#dgrad)"/>
    <!-- Corner accent triangles -->
    <path d="M 70 -135 Q 105 -135, 105 -100 L 70 -100 Z" fill="url(#dgrad2)" opacity="0.85"/>
    <path d="M -105 100 Q -105 135, -70 135 L -70 100 Z" fill="url(#dgrad2)" opacity="0.85"/>
  </g>
</svg>
