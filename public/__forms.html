<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Netlify detects forms from static HTML at deploy time and stores only the
      fields declared here. components/Conversation.tsx posts to this path.
      Keep the field names identical in both files.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="topic" />
      <input name="need" />
      <input name="email" type="email" />
      <input name="name" />
      <input name="company" />
      <textarea name="message"></textarea>
      <input name="persona" />
      <input name="journey" />
      <input name="referrer" />
      <input name="utm" />
      <input name="landing" />
    </form>
  </body>
</html>
